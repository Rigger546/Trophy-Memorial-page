<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In Memory of Lee Luscombe</title>
  <meta name="description" content="In memory of Lee Luscombe, fondly remembered for his company on and off the golf course.">
  <meta name="theme-color" content="#173026">
  <meta property="og:type" content="website">
  <meta property="og:title" content="In Memory of Lee Luscombe">
  <meta property="og:description" content="Fondly remembered for his company on and off the golf course.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23173026'/%3E%3Cpath d='M17 5v20' stroke='%23c9a86a' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M17 6l8 3.6L17 13.2z' fill='%23c9a86a'/%3E%3Cellipse cx='17' cy='26' rx='7' ry='2' fill='%23c9a86a' opacity='.55'/%3E%3C/svg%3E">

  <style>
    :root {
      --green-900: #10221b;
      --green-800: #173026;
      --green-700: #1f4232;
      --cream: #f6f1e6;
      --cream-dim: #d9d2c0;
      --ink: #1d2b24;
      --ink-soft: #55645b;
      --gold: #c9a86a;
      --gold-deep: #8f7239;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--serif);
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2.5rem, 7vw, 6rem) 1.5rem;
      color: var(--cream);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201, 168, 106, .14), transparent 70%),
        linear-gradient(180deg, var(--green-700) 0%, var(--green-800) 45%, var(--green-900) 100%);
      overflow: hidden;
    }

    .hero-inner {
      width: min(100%, 1040px);
      display: grid;
      grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
      align-items: center;
      gap: clamp(2rem, 6vw, 5rem);
    }

    /* Portrait in an arched frame */
    .portrait {
      margin: 0;
      justify-self: center;
      width: 100%;
      position: relative;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: -14px;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 10px 10px;
      opacity: .7;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: 50% 12%;
      border-radius: 999px 999px 6px 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }

    /* Dedication */
    .dedication { text-align: left; }

    .dedication h1 {
      margin: 0;
      font-weight: 400;
      line-height: 1.1;
    }

    .lead-in {
      display: block;
      font-size: clamp(.85rem, 2.4vw, 1rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .9rem;
    }

    .name {
      display: block;
      font-size: clamp(2.6rem, 8.5vw, 5.2rem);
      letter-spacing: .01em;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.75rem 0;
      color: var(--gold);
    }

    .rule::before, .rule::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      flex: 1;
    }

    .rule::before { display: none; }
    .rule svg { width: 34px; height: 34px; flex: none; }

    .tribute {
      margin: 0;
      max-width: 30ch;
      font-size: clamp(1.25rem, 3.6vw, 1.8rem);
      font-style: italic;
      line-height: 1.5;
      color: var(--cream-dim);
    }

    .scroll-hint {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold);
      opacity: .75;
      text-decoration: none;
      font-size: .8rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
    }

    .scroll-hint svg { width: 18px; height: 18px; animation: nudge 2.4s ease-in-out infinite; }

    @keyframes nudge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* Gentle entrance */
    .portrait, .dedication > * { animation: rise 1.1s ease-out both; }
    .dedication h1 { animation-delay: .25s; }
    .dedication .rule { animation-delay: .5s; }
    .dedication .tribute { animation-delay: .7s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Video ---------- */
    .film {
      padding: clamp(3.5rem, 8vw, 6rem) 1.5rem clamp(3rem, 7vw, 5rem);
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .5), transparent 220px),
        var(--cream);
    }

    .film h2 {
      margin: 0 0 .4rem;
      font-weight: 400;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: var(--green-800);
    }

    .film .sub {
      margin: 0 0 2rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    .player {
      /* portrait clip: keep it fully visible on short desktop screens too */
      width: min(100%, 380px, calc(78svh * 464 / 816));
      margin: 0 auto;
      padding: 10px;
      background: var(--green-800);
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(16, 34, 27, .28);
      outline: 1px solid var(--gold);
      outline-offset: 5px;
    }

    .player video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 464 / 816;
      border-radius: 6px;
      background: #000;
    }

    /* ---------- Footer ---------- */
    footer {
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
      background: var(--green-900);
      color: var(--cream-dim);
    }

    footer svg { width: 30px; height: 30px; color: var(--gold); }
    footer p { margin: .6rem 0 0; font-style: italic; letter-spacing: .04em; }

    /* ---------- Mobile / narrow ---------- */
    @media (max-width: 760px) {
      .hero { align-items: start; padding-top: 2.5rem; padding-bottom: 5.5rem; }

      .hero-inner {
        grid-template-columns: minmax(0, 1fr);
        gap: 2.75rem;
        justify-items: center;
      }

      .portrait { width: min(72vw, 300px); }
      .dedication { text-align: center; }
      .tribute { margin-inline: auto; }
      .rule { justify-content: center; }
      .rule::before { display: block; background: linear-gradient(270deg, var(--gold), transparent); }
    }

    a:focus-visible, video:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .portrait, .dedication > *, .scroll-hint svg { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <header class="hero">
      <div class="hero-inner">
        <figure class="portrait">
          <img src="assets/lee-luscombe.jpg" width="820" height="1032" alt="Portrait of Lee Luscombe smiling, wearing a tweed jacket and pale blue shirt">
        </figure>

        <div class="dedication">
          <h1>
            <span class="lead-in">In memory of</span>
            <span class="name">Lee Luscombe</span>
          </h1>

          <div class="rule" aria-hidden="true">
            <!-- golf flag on the green -->
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M17 4v20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M17 5l9 4-9 4z" fill="currentColor"/>
              <ellipse cx="17" cy="25.5" rx="9" ry="2.6" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
              <circle cx="11" cy="26.4" r="1.6" fill="currentColor"/>
            </svg>
          </div>

          <p class="tribute">fondly remembered for his company on and off the golf course</p>
        </div>
      </div>

      <a class="scroll-hint" href="#film">
        Video
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </header>

    <section class="film" id="film" aria-labelledby="film-title">
      <h2 id="film-title">Remembered on the course</h2>
      <p class="sub">Press play to watch</p>

      <div class="player">
        <video controls playsinline preload="metadata" poster="assets/tribute-poster.jpg" aria-label="Video of Lee Luscombe and friends on the golf course">
          <source src="assets/tribute.mp4" type="video/mp4">
          Your browser cannot play this video. <a href="assets/tribute.mp4">Download it here</a>.
        </video>
      </div>
    </section>
  </main>

  <footer>
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M17 4v20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M17 5l9 4-9 4z" fill="currentColor"/>
      <ellipse cx="17" cy="25.5" rx="9" ry="2.6" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
    </svg>
    <p>Lee Luscombe &mdash; always remembered</p>
  </footer>
</body>
</html>
